<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StackChan 顔のアトリエ</title>
<style>
:root{font-family:system-ui,sans-serif;color:#263f3a;background:#f4f1e9;--green:#285d50;--line:#d8ded4}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,5vw);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}h1{font-size:25px;margin:0}header p{margin:6px 0 0;color:#62746d}.tag{background:#e5ece0;border-radius:24px;padding:7px 13px;font-size:13px;white-space:nowrap}main{max-width:1220px;margin:auto;padding:26px 24px}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:white;color:#263f3a;cursor:pointer}button:hover{border-color:#427d69}button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.4;cursor:default}.primary{background:var(--green);color:white}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.card{background:#fffefb;border:1px solid var(--line);border-radius:18px;padding:20px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.caption{font-size:12px;color:#6f7e75;letter-spacing:.08em;margin:0 0 12px}.hint{color:#62746d;font-size:13px;line-height:1.7}h2{font-size:16px;margin:0 0 14px}.toolbar{margin:14px 0}#drawing{display:block;width:100%;aspect-ratio:4/3;touch-action:none;background:#000;border-radius:12px;cursor:crosshair}#preview{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px}label{font-size:13px}input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px}input[type=text]{width:100%;border:1px solid var(--line);padding:10px;border-radius:8px;margin:10px 0}select{padding:8px;border:1px solid var(--line);border-radius:8px;background:white}.part{flex:1;min-width:70px}.side{display:flex;flex-direction:column;gap:18px}.templates button{width:100%;text-align:left;margin:4px 0}.footer{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}#notice{min-height:28px;margin:14px 0;color:#285d50;white-space:pre-wrap}#notice[data-error=true]{color:#a23c31}a{color:#285d50}.sr{position:absolute;left:-10000px}@media(max-width:850px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}header{align-items:flex-start}.tag{font-size:11px}}@media(max-width:540px){main{padding:16px 10px}.card{padding:14px}.side{display:flex}header{padding:18px 14px}h1{font-size:21px}.part{padding:10px 6px}}
</style>
<header><div><p class="caption">STACKCHAN / FACE ATELIER</p><h1>顔のアトリエ</h1><p>描いた顔で、いつものおしゃべり。</p></div><span class="tag" id="connection">本体を確認中</span></header>
<main><div class="grid"><section class="card"><div class="row space"><h2>顔を描く</h2><label>表情 <select id="expression"><option value="neutral">通常</option><option value="happy">うれしい</option><option value="sad">かなしい</option><option value="angry">おこる</option></select></label></div>
<div class="row" id="parts" aria-label="描くパーツ"><button class="part" data-part="leftEye">左目</button><button class="part" data-part="rightEye">右目</button><button class="part" data-part="mouth">口</button><button class="part" data-part="decoration">飾り</button></div>
<div class="row toolbar"><label>道具 <select id="tool"><option value="path">ペン</option><option value="ellipse">丸</option><option value="rect">四角</option><option value="eraser">線を消す</option></select></label><label>色 <input id="color" type="color" value="#ffffff"></label><label>太さ <input id="width" type="range" min="1" max="20" value="4" style="width:85px"></label><label><input id="fill" type="checkbox" checked>図形を塗る</label></div>
<canvas id="drawing" width="320" height="240" aria-label="顔を描くキャンバス"></canvas>
<div class="row toolbar"><button id="undo">元に戻す</button><button id="redo">やり直す</button><button id="clearPart">このパーツを消す</button><button id="copyNeutral">通常の顔をコピー</button></div>
<p class="hint">動かしたい部分に合わせて「左目・右目・口」を選んで描きます。「飾り」は動きません。未作成の表情では通常の顔を使います。</p>
<div class="footer row space"><label>背景 <input id="background" type="color" value="#000000"></label><div class="row"><button id="export">ファイルに保存</button><button id="import">ファイルを開く</button><input class="sr" id="file" type="file" accept="application/json,.json"></div></div></section>
<aside class="side"><section class="card"><p class="caption">LIVE PREVIEW</p><h2>動いたときの顔</h2><canvas id="preview" width="320" height="240" aria-label="顔の動きのプレビュー"></canvas><div class="row toolbar"><label><input id="blink" type="checkbox" checked>まばたき</label><label><input id="talk" type="checkbox" checked>口を動かす</label></div><p class="hint">音は鳴りません。本体では口の開きやまばたきに連動します。</p><input id="name" maxlength="40" placeholder="顔の名前" aria-label="顔の名前"><button id="apply" class="primary" style="width:100%">本体に保存して反映</button><p id="notice" role="status"></p><button id="restore">本体を標準の顔に戻す</button></section>
<section class="card templates"><p class="caption">START WITH A FACE</p><h2>テンプレート</h2><button id="deviceTemplate">本体に保存した顔</button><button data-template="current">スタックチャンの顔</button><button data-template="round">まるい顔</button><button data-template="blank">白紙から描く</button><button id="draft">このブラウザの下書き</button><p class="hint">描いた内容はこのブラウザにも下書き保存します。本体へ反映するまでは本体の顔は変わりません。</p><a href="/">設定画面へ戻る</a></section></aside></div></main><script type="module" src="./face-editor.js"></script></html>
