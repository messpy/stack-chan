name: CoreS3 Internal RAM Regression (P1)

on:
  push:
    branches:
      - perf/issue40-usb-rx-psram-20261107
    paths:
      - 'firmware/host/app/archive-usb.c'
      - 'firmware/host/app/archive-memory-policy.js'
      - 'firmware/scripts/lib/archive-usb-psram.test.mjs'
      - 'firmware/scripts/lib/archive-memory-policy.test.mjs'
      - '.github/workflows/archive-internal-ram.yml'
  pull_request:
    branches:
      - stackchan-super
    paths:
      - 'firmware/host/app/archive-usb.c'
      - 'firmware/host/app/archive-memory-policy.js'
      - 'firmware/scripts/lib/archive-usb-psram.test.mjs'
      - 'firmware/scripts/lib/archive-memory-policy.test.mjs'
      - '.github/workflows/archive-internal-ram.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PSRAM-only USB allocation and bounds
        run: node --test firmware/scripts/lib/archive-usb-psram.test.mjs
      - name: Preserve XiaoZhi low-RAM admission safety
        run: node firmware/scripts/lib/archive-memory-policy.test.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
