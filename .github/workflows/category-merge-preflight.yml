name: Category merge preflight (read only)
on:
  push:
    branches:
      - integration/stackchan-categories-20261110
  workflow_dispatch:
permissions:
  contents: write
jobs:
  conflict-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect five category merge conflicts without editing refs
        shell: bash
        run: |
          git fetch --no-tags origin             refs/heads/category/voice-ai:refs/remotes/origin/category/voice-ai             refs/heads/category/camera:refs/remotes/origin/category/camera             refs/heads/category/web:refs/remotes/origin/category/web             refs/heads/category/ui:refs/remotes/origin/category/ui             refs/heads/category/system:refs/remotes/origin/category/system
          failed=0
          for name in voice-ai camera web ui system; do
            echo "===== CATEGORY $name ====="
            log="$(mktemp)"
            if git merge-tree --write-tree --name-only HEAD "origin/category/$name" > "$log" 2>&1; then
              echo "MERGE_TREE=clean"
              head -12 "$log"
            else
              rc=$?
              echo "MERGE_TREE=conflicted EXIT=$rc"
              grep -E '^(CONFLICT|Auto-merging|[[:space:]]*firmware/|[[:space:]]*\.github/|[[:space:]]*docs/)' "$log" | head -100 || true
              failed=$((failed+1))
            fi
            rm -f "$log"
          done
          echo "CONFLICTED_CATEGORIES=$failed"
          # This job only diagnoses conflicts. It never pushes or merges.
          exit 0
      - name: Simulate sequential integration without pushing
        shell: bash
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "Category Merge Preflight"
          for name in camera voice-ai web ui system; do
            echo "===== SEQUENTIAL $name ====="
            if git merge --no-commit --no-ff "origin/category/$name" >/tmp/category-merge.log 2>&1; then
              git commit -m "test: simulated category $name" >/dev/null
              echo "MERGE=clean"
            else
              echo "MERGE=conflicted"
              git diff --name-only --diff-filter=U | head -100
              echo 'UNMERGED_BLOB_SHA:'
              git ls-files --unmerged | head -80
              echo 'CONFLICT_HUNKS:'
              python3 - <<'PY'
          import pathlib, subprocess
          paths = subprocess.run(['git','diff','--name-only','--diff-filter=U'],capture_output=True,text=True).stdout.splitlines()
          for path in paths[:12]:
              data=pathlib.Path(path).read_text(errors='replace').splitlines()
              starts=[i for i,line in enumerate(data) if line.startswith('<<<<<<< ')]
              print('FILE',path,'hunks',len(starts))
              for i in starts[:6]:
                  end=next((j for j in range(i+1,len(data)) if data[j].startswith('>>>>>>> ')),min(i+50,len(data)-1))
                  for j in range(max(0,i-2),min(len(data),end+3)):
                      print(str(j+1)+': '+data[j][:230])
          PY
              sed -n '1,25p' /tmp/category-merge.log
              git merge --abort
            fi
          done
          echo "SIMULATED_SHA=$(git rev-parse --short HEAD)"
          echo "This checkout is disposable. No push, no production merge."
  reconcile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current base into UI category and resolve boot/idle conflict
        shell: bash
        run: |
          git fetch origin refs/heads/category/ui refs/heads/stackchan-super
          git config user.name "StackChan CI"
          git config user.email "ci@users.noreply.github.com"
          git switch --create category-ui-reconcile origin/category/ui
          if git merge --no-ff --no-commit origin/stackchan-super > /tmp/ui-reconcile.log 2>&1; then
            echo '[CHECK] UI merge had no conflicting paths'
          else
            paths="$(git diff --name-only --diff-filter=U)"
            if [ "$paths" != "firmware/host/app/archive-offline.js" ]; then
              echo "[FATAL] Unexpected UI conflicts"
              sed -n '1,60p' /tmp/ui-reconcile.log
              printf '%s\n' "$paths"
              exit 1
            fi
            git checkout --ours -- firmware/host/app/archive-offline.js
            if ! grep -Fq 'globalThis.stackchanIdleActivity?.()' firmware/host/app/archive-offline.js; then
              echo '[FATAL] UI activity hook missing after conflict resolution'
              exit 1
            fi
            if ! grep -Fq "if (action !== 'boot') {" firmware/host/app/archive-offline.js; then
              echo '[FATAL] boot speech guard missing after conflict resolution'
              exit 1
            fi
            git add firmware/host/app/archive-offline.js
          fi
          git diff --cached --check
          git -c user.name="StackChan CI" -c user.email="ci@users.noreply.github.com" commit -m "merge(ui): reconcile main boot mode guard with idle activity hook"
          cd firmware
          node --experimental-vm-modules --test scripts/lib/archive-offline.test.mjs scripts/lib/archive-idle-sleep.test.mjs
          cd ..
          git push origin HEAD:refs/heads/category/ui
          echo '[CHECK] UI category reconciled; no stackchan-super push'
