name: Archive Idle Sleep Tests

on:
  pull_request:
    branches:
      - stackchan-super
    paths:
      - 'firmware/host/app/archive-idle-*.js'
      - 'firmware/host/app/lan-archive.js'
      - 'firmware/scripts/lib/archive-idle-sleep.test.mjs'
      - '.github/workflows/archive-idle-sleep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idle-sleep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run two-stage sleep policy/render regression
        working-directory: firmware
        run: node --test scripts/lib/archive-idle-sleep.test.mjs
